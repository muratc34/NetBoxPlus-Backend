# Weekly update pull requests against master, the default branch. NuGet versions live in
# Directory.Packages.props, so each update is one line.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # The services run on .NET 10 (global.json). These packages ship with each .NET major, so
    # their next major means moving to the next .NET: a decision of its own, not a weekly update.
    # Minor and patch versions still come. A grouped update that mixed majors failed to restore.
    ignore:
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql*"
        update-types: ["version-update:semver-major"]
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*", "Npgsql*"]
      opentelemetry:
        patterns: ["OpenTelemetry*"]
      testing:
        patterns: ["xunit*", "Testcontainers*"]
