# Builds and tests the whole repository on every push and pull request.
# Actions are pinned to commit SHAs (the version is in the comment); Dependabot keeps them current.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'nuget.config', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore NetBoxPlus.slnx

      # Warnings are errors (Directory.Build.props). The build also regenerates docs/openapi.
      - name: Build
        run: dotnet build NetBoxPlus.slnx --configuration Release --no-restore

      - name: Check that the OpenAPI documents are up to date
        run: |
          if [ -n "$(git status --porcelain -- docs/openapi)" ]; then
            echo "::error::docs/openapi differs from the build output. Build locally and commit the documents."
            git status --short -- docs/openapi
            git diff -- docs/openapi
            exit 1
          fi

      # The streaming transcoder's and the demo seeder's tests run the real ffmpeg; like Docker, it
      # is required here. The seeder draws titles with the DejaVu font, as in its image.
      # Ubuntu's mirror sometimes serves the ~60 MB of packages at a crawl (minutes), so the .deb
      # files are cached per runner image: the same image needs exactly the same packages.
      - name: Find the runner image
        id: runner-image
        run: echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Restore the ffmpeg packages
        id: ffmpeg-packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ffmpeg-packages
          key: ffmpeg-${{ steps.runner-image.outputs.version }}

      - name: Install ffmpeg
        env:
          CACHED: ${{ steps.ffmpeg-packages.outputs.cache-hit }}
          PACKAGES: ${{ runner.temp }}/ffmpeg-packages
        run: |
          if [ "$CACHED" != "true" ]; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends --download-only ffmpeg fonts-dejavu-core
            mkdir -p "$PACKAGES"
            cp /var/cache/apt/archives/*.deb "$PACKAGES"/
          fi
          # Installing the files themselves needs no package lists and downloads nothing.
          sudo apt-get install --yes --no-install-recommends --no-download "$PACKAGES"/*.deb
          ffmpeg -hide_banner -version | head -n 1

      # Integration tests start PostgreSQL and RabbitMQ with Testcontainers. Locally they are
      # skipped without Docker; here a missing Docker fails them.
      - name: Test
        env:
          NETBOXPLUS_REQUIRE_DOCKER: "true"
        run: >-
          dotnet test --solution NetBoxPlus.slnx --configuration Release --no-build
          --report-xunit-trx --results-directory "${{ runner.temp }}/test-results"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: ${{ runner.temp }}/test-results
          if-no-files-found: ignore

  # Builds every image without pushing it, so a Dockerfile that misses a project it needs fails here.
  image:
    name: Image (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gateway
            dockerfile: src/Gateway/Gateway/Dockerfile
          - name: auth-api
            dockerfile: src/Services/Auth/Auth.API/Dockerfile
          - name: catalog-api
            dockerfile: src/Services/Catalog/Catalog.API/Dockerfile
          - name: billing-api
            dockerfile: src/Services/Billing/Billing.API/Dockerfile
          - name: streaming-api
            dockerfile: src/Services/Streaming/Streaming.API/Dockerfile
          - name: streaming-transcoder
            dockerfile: src/Services/Streaming/Streaming.Transcoder/Dockerfile
          - name: notification-api
            dockerfile: src/Services/Notification/Notification.API/Dockerfile
          - name: auth-migrator
            dockerfile: src/Services/Auth/Auth.Migrator/Dockerfile
          - name: catalog-migrator
            dockerfile: src/Services/Catalog/Catalog.Migrator/Dockerfile
          - name: billing-migrator
            dockerfile: src/Services/Billing/Billing.Migrator/Dockerfile
          - name: streaming-migrator
            dockerfile: src/Services/Streaming/Streaming.Migrator/Dockerfile
          - name: notification-migrator
            dockerfile: src/Services/Notification/Notification.Migrator/Dockerfile
          - name: demo-seed
            dockerfile: src/Tools/NetBoxPlus.DemoSeeder/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          IMAGE: netboxplus/${{ matrix.name }}:ci
        run: docker build --file "$DOCKERFILE" --tag "$IMAGE" .
