# Local development dependencies. Start with ./deploy/dev.ps1 up (creates deploy/.env on first run).
# Every port is bound to 127.0.0.1 only: several services run without authentication locally.

name: netboxplus

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 5s
  retries: 30
  start_period: 10s

# Shared by the "app" profile below.
x-app-values:
  amqp: &amqp amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
  # The emulator's well-known development account (published by Microsoft, not a secret).
  azurite: &azurite DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;

x-migrator-dependencies: &migrator-dependencies
  postgres: { condition: service_healthy }
  rabbitmq: { condition: service_healthy }

x-migrator: &migrator
  profiles: ["app"]
  restart: "no"
  depends_on: *migrator-dependencies

x-api-dependencies: &api-dependencies
  postgres: { condition: service_healthy }
  rabbitmq: { condition: service_healthy }
  aspire-dashboard: { condition: service_started }

x-api: &api
  profiles: ["app"]
  restart: unless-stopped

x-api-environment: &api-environment
  # Aspire dashboard by default; dev.ps1 up -App -Observability points it at the otel-lgtm container.
  OTEL_EXPORTER_OTLP_ENDPOINT: ${NETBOXPLUS_OTLP_ENDPOINT:-http://aspire-dashboard:18889}
  # Every 15 s instead of the default 60 s, so rates over a minute have enough points.
  OTEL_METRIC_EXPORT_INTERVAL: "15000"
  Messaging__ConnectionString: *amqp
  # The services find the token keys through the auth service, inside the compose network.
  Authentication__Schemes__Bearer__Authority: http://auth-api:8080
  Authentication__Schemes__Bearer__RequireHttpsMetadata: "false"

services:
  postgres:
    image: postgres:18.6-alpine
    # Connection budget: each service process pools at most 20 connections (AddPersistence), so five
    # APIs and the transcoder take up to 120; the rest is for migrators, tools, services run from the
    # IDE and the 3 slots PostgreSQL keeps for superusers.
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?set POSTGRES_ADMIN_USER in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in deploy/.env}
      # One database and one login role per service, each role limited to its own database.
      NETBOXPLUS_DATABASES: auth,catalog,billing,streaming,notification
      NETBOXPLUS_SERVICE_PASSWORD: ${POSTGRES_SERVICE_PASSWORD:?set POSTGRES_SERVICE_PASSWORD in deploy/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "pg_isready --username \"$${POSTGRES_USER}\" --dbname postgres"]

  rabbitmq:
    image: rabbitmq:4.4-management-alpine
    # RabbitMQ keys its data directory by node name; a fixed hostname keeps the volume usable.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER in deploy/.env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in deploy/.env}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "rabbitmq-diagnostics", "--quiet", "ping"]

  valkey:
    image: valkey/valkey:9.2-alpine
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?set VALKEY_PASSWORD in deploy/.env}
    command: ["sh", "-c", "exec valkey-server --appendonly yes --requirepass \"$$VALKEY_PASSWORD\""]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning -a \"$$VALKEY_PASSWORD\" ping | grep -q PONG"]

  # Azure Blob Storage emulator for catalog images.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--location", "/data", "--skipApiVersionCheck"]
    ports:
      - "127.0.0.1:10000:10000"
    volumes:
      - azurite-data:/data
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10000"]

  # Search is needed from phase 2 on; start it with ./deploy/dev.ps1 up -Search (-App includes it).
  elasticsearch:
    image: elasticsearch:9.5.5
    profiles: ["search", "app"]
    environment:
      discovery.type: single-node
      # Local only (bound to 127.0.0.1); production runs with security enabled.
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      <<: *healthcheck
      start_period: 30s
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' > /dev/null"]

  # Receives OTLP from the services (OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317) and shows
  # logs, traces and metrics at http://localhost:18888.
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.2
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "127.0.0.1:18888:18888"
      - "127.0.0.1:4317:18889"
      - "127.0.0.1:4318:18890"

  # Grafana with Prometheus, Loki and Tempo behind one OpenTelemetry collector, for ./deploy/dev.ps1
  # up -App -Observability: the app containers then send their telemetry here instead of to the
  # Aspire dashboard. Grafana at http://localhost:3000 (anonymous viewing; admin/admin to edit).
  lgtm:
    profiles: ["observability"]
    image: grafana/otel-lgtm:0.39.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /otel-lgtm/grafana/conf/provisioning/dashboards/netboxplus/netboxplus.json
    volumes:
      - ./observability/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/netboxplus.yaml:ro
      - ./observability/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards/netboxplus:ro
    ports:
      - "127.0.0.1:3000:3000"

  # Catches every e-mail the notification service sends locally (SMTP on 1025); read them at
  # http://localhost:8025 or through its API. Nothing leaves the machine.
  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/mailpit", "readyz"]

  # ---------------------------------------------------------------------------------------------
  # The whole system in containers: ./deploy/dev.ps1 up -App (compose profile "app").
  # Each service's Migrator runs first and exits; the APIs start once it succeeded. Settings come
  # from deploy/.env only. The API ports are the ones used when running from the IDE, so run one
  # or the other. The images have no shell, hence no health checks here: "up -App" polls
  # /health/ready from outside.
  # ---------------------------------------------------------------------------------------------

  auth-migrator:
    <<: *migrator
    image: netboxplus/auth-migrator:local
    build: { context: .., dockerfile: src/Services/Auth/Auth.Migrator/Dockerfile }
    environment:
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=auth;Username=auth;Password=${POSTGRES_SERVICE_PASSWORD}
      Messaging__ConnectionString: *amqp
      Auth__Seed__AdminEmail: ${AUTH_ADMIN_EMAIL}
      Auth__Seed__AdminPassword: ${AUTH_ADMIN_PASSWORD}

  auth-api:
    <<: *api
    image: netboxplus/auth-api:local
    build: { context: .., dockerfile: src/Services/Auth/Auth.API/Dockerfile }
    depends_on:
      <<: *api-dependencies
      auth-migrator: { condition: service_completed_successfully }
    # A list, not a map: the key id is part of a variable name, and only list entries are interpolated whole.
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=${NETBOXPLUS_OTLP_ENDPOINT:-http://aspire-dashboard:18889}
      - OTEL_METRIC_EXPORT_INTERVAL=15000
      - OTEL_SERVICE_NAME=auth-api
      - ConnectionStrings__Database=Host=postgres;Port=5432;Database=auth;Username=auth;Password=${POSTGRES_SERVICE_PASSWORD}
      - Messaging__ConnectionString=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      - Auth__Tokens__ActiveKeyId=${AUTH_TOKEN_KEY_ID:?run ./deploy/dev.ps1 once to create the signing keys}
      - Auth__Tokens__SigningKeys__${AUTH_TOKEN_KEY_ID}=${AUTH_TOKEN_SIGNING_KEY:?run ./deploy/dev.ps1 once to create the signing keys}
    ports:
      - "127.0.0.1:5103:8080"

  catalog-migrator:
    <<: *migrator
    image: netboxplus/catalog-migrator:local
    build: { context: .., dockerfile: src/Services/Catalog/Catalog.Migrator/Dockerfile }
    depends_on:
      <<: *migrator-dependencies
      azurite: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
    environment:
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=catalog;Username=catalog;Password=${POSTGRES_SERVICE_PASSWORD}
      Messaging__ConnectionString: *amqp
      ConnectionStrings__Images: *azurite
      ConnectionStrings__Search: http://elasticsearch:9200
      Images__UploadOrigins__0: http://localhost:5174

  catalog-api:
    <<: *api
    image: netboxplus/catalog-api:local
    build: { context: .., dockerfile: src/Services/Catalog/Catalog.API/Dockerfile }
    depends_on:
      <<: *api-dependencies
      catalog-migrator: { condition: service_completed_successfully }
    environment:
      <<: *api-environment
      OTEL_SERVICE_NAME: catalog-api
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=catalog;Username=catalog;Password=${POSTGRES_SERVICE_PASSWORD}
      ConnectionStrings__Images: *azurite
      ConnectionStrings__Search: http://elasticsearch:9200
      BlobStorage__PublicEndpoint: http://127.0.0.1:10000/devstoreaccount1
    ports:
      - "127.0.0.1:5104:8080"

  billing-migrator:
    <<: *migrator
    image: netboxplus/billing-migrator:local
    build: { context: .., dockerfile: src/Services/Billing/Billing.Migrator/Dockerfile }
    environment:
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=billing;Username=billing;Password=${POSTGRES_SERVICE_PASSWORD}
      Messaging__ConnectionString: *amqp

  billing-api:
    <<: *api
    image: netboxplus/billing-api:local
    build: { context: .., dockerfile: src/Services/Billing/Billing.API/Dockerfile }
    depends_on:
      <<: *api-dependencies
      billing-migrator: { condition: service_completed_successfully }
    environment:
      <<: *api-environment
      OTEL_SERVICE_NAME: billing-api
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=billing;Username=billing;Password=${POSTGRES_SERVICE_PASSWORD}
      # Empty without a Stripe account: payments then answer 503, as when run from the IDE.
      Billing__Stripe__SecretKey: ${STRIPE_SECRET_KEY:-}
      Billing__Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-}
      Billing__Checkout__SuccessUrl: http://localhost:5173/account/subscription?checkout=success
      Billing__Checkout__CancelUrl: http://localhost:5173/plans
      Billing__Checkout__PortalReturnUrl: http://localhost:5173/account/subscription
    ports:
      - "127.0.0.1:5105:8080"

  streaming-migrator:
    <<: *migrator
    image: netboxplus/streaming-migrator:local
    build: { context: .., dockerfile: src/Services/Streaming/Streaming.Migrator/Dockerfile }
    depends_on:
      <<: *migrator-dependencies
      azurite: { condition: service_healthy }
    environment:
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=streaming;Username=streaming;Password=${POSTGRES_SERVICE_PASSWORD}
      Messaging__ConnectionString: *amqp
      ConnectionStrings__Videos: *azurite
      Videos__UploadOrigins__0: http://localhost:5174
      Videos__PlaybackOrigins__0: http://localhost:5173

  streaming-api:
    <<: *api
    image: netboxplus/streaming-api:local
    build: { context: .., dockerfile: src/Services/Streaming/Streaming.API/Dockerfile }
    depends_on:
      <<: *api-dependencies
      streaming-migrator: { condition: service_completed_successfully }
    environment:
      <<: *api-environment
      OTEL_SERVICE_NAME: streaming-api
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=streaming;Username=streaming;Password=${POSTGRES_SERVICE_PASSWORD}
      ConnectionStrings__Videos: *azurite
      BlobStorage__PublicEndpoint: http://127.0.0.1:10000/devstoreaccount1
      Playback__SigningKey: ${PLAYBACK_SIGNING_KEY:?run ./deploy/dev.ps1 once to create the signing keys}
    ports:
      - "127.0.0.1:5106:8080"

  # Converts uploaded videos; no broker, the API's outbox sends its events.
  streaming-transcoder:
    profiles: ["app"]
    image: netboxplus/streaming-transcoder:local
    build: { context: .., dockerfile: src/Services/Streaming/Streaming.Transcoder/Dockerfile }
    restart: unless-stopped
    depends_on:
      streaming-migrator: { condition: service_completed_successfully }
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${NETBOXPLUS_OTLP_ENDPOINT:-http://aspire-dashboard:18889}
      OTEL_METRIC_EXPORT_INTERVAL: "15000"
      OTEL_SERVICE_NAME: streaming-transcoder
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=streaming;Username=streaming;Password=${POSTGRES_SERVICE_PASSWORD}
      ConnectionStrings__Videos: *azurite

  notification-migrator:
    <<: *migrator
    image: netboxplus/notification-migrator:local
    build: { context: .., dockerfile: src/Services/Notification/Notification.Migrator/Dockerfile }
    environment:
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=notification;Username=notification;Password=${POSTGRES_SERVICE_PASSWORD}
      Messaging__ConnectionString: *amqp

  notification-api:
    <<: *api
    image: netboxplus/notification-api:local
    build: { context: .., dockerfile: src/Services/Notification/Notification.API/Dockerfile }
    depends_on:
      <<: *api-dependencies
      notification-migrator: { condition: service_completed_successfully }
      mailpit: { condition: service_healthy }
    environment:
      <<: *api-environment
      OTEL_SERVICE_NAME: notification-api
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=notification;Username=notification;Password=${POSTGRES_SERVICE_PASSWORD}
      Notification__WebBaseUrl: http://localhost:5173
      Notification__ApiBaseUrl: http://localhost:5100/notification/
      # dev.ps1 sets these to Brevo only when deploy/.env says EMAIL_PROVIDER=Brevo, as "secrets" does.
      Email__Provider: ${NETBOXPLUS_EMAIL_PROVIDER:-Smtp}
      Email__From: ${NETBOXPLUS_EMAIL_FROM:-no-reply@netboxplus.local}
      Email__Smtp__Host: mailpit
      Email__Smtp__Port: "1025"
      Email__Brevo__ApiKey: ${BREVO_API_KEY:-}
    ports:
      - "127.0.0.1:5107:8080"

  gateway:
    <<: *api
    image: netboxplus/gateway:local
    build: { context: .., dockerfile: src/Gateway/Gateway/Dockerfile }
    depends_on:
      valkey: { condition: service_healthy }
      auth-api: { condition: service_started }
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${NETBOXPLUS_OTLP_ENDPOINT:-http://aspire-dashboard:18889}
      OTEL_METRIC_EXPORT_INTERVAL: "15000"
      OTEL_SERVICE_NAME: gateway
      ConnectionStrings__Valkey: valkey:6379,password=${VALKEY_PASSWORD}
      ServerClient__Key: ${GATEWAY_SERVER_KEY:?run ./deploy/dev.ps1 once to create the keys}
      Cors__PublicOrigins__0: http://localhost:5173
      Cors__AdminOrigins__0: http://localhost:5174
    ports:
      - "127.0.0.1:5100:8080"

  # Load tests: ./deploy/dev.ps1 load (needs up -App and seed). Scripts and results in deploy/load.
  k6:
    profiles: ["tools"]
    image: grafana/k6:2.3.0
    restart: "no"
    working_dir: /scripts
    volumes:
      - ./load:/scripts
    environment:
      BASE_URL: http://gateway:8080
      # Segment addresses are handed out for browsers (127.0.0.1); inside this network that is k6 itself.
      PUBLIC_STORAGE_ENDPOINT: http://127.0.0.1:10000
      STORAGE_ENDPOINT: http://azurite:10000
      LOAD_USER_PASSWORD: ${LOAD_USER_PASSWORD:-}
      K6_OTEL_GRPC_EXPORTER_ENDPOINT: lgtm:4317
      K6_OTEL_GRPC_EXPORTER_INSECURE: "true"
      K6_OTEL_SERVICE_NAME: k6

  # Demo content through the gateway's admin API: ./deploy/dev.ps1 seed (needs up -App running).
  demo-seed:
    profiles: ["tools"]
    image: netboxplus/demo-seed:local
    build: { context: .., dockerfile: src/Tools/NetBoxPlus.DemoSeeder/Dockerfile }
    restart: "no"
    environment:
      Seeder__Gateway: http://gateway:8080
      Seeder__AdminEmail: ${AUTH_ADMIN_EMAIL}
      Seeder__AdminPassword: ${AUTH_ADMIN_PASSWORD}
      Seeder__StripeSecretKey: ${STRIPE_SECRET_KEY:-}
      # Upload addresses are handed out for browsers (127.0.0.1); inside this network that is the
      # container itself, so the seeder sends them to azurite instead.
      Seeder__PublicStorageEndpoint: http://127.0.0.1:10000
      Seeder__StorageEndpoint: http://azurite:10000

volumes:
  postgres-data:
  rabbitmq-data:
  valkey-data:
  azurite-data:
  elasticsearch-data:
