# Builds and tests the whole repository on every push and pull request.
# Actions are pinned to commit SHAs (the version is in the comment); Dependabot keeps them current.

name: CI

on:
  push:
    branches: [master, v2]
  pull_request:
    branches: [master, v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'nuget.config', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore NetBoxPlus.slnx

      # Warnings are errors (Directory.Build.props). The build also regenerates docs/openapi.
      - name: Build
        run: dotnet build NetBoxPlus.slnx --configuration Release --no-restore

      - name: Check that the OpenAPI documents are up to date
        run: |
          if [ -n "$(git status --porcelain -- docs/openapi)" ]; then
            echo "::error::docs/openapi differs from the build output. Build locally and commit the documents."
            git status --short -- docs/openapi
            git diff -- docs/openapi
            exit 1
          fi

      # Integration tests start PostgreSQL and RabbitMQ with Testcontainers. Locally they are
      # skipped without Docker; here a missing Docker fails them.
      - name: Test
        env:
          NETBOXPLUS_REQUIRE_DOCKER: "true"
        run: >-
          dotnet test --solution NetBoxPlus.slnx --configuration Release --no-build
          --report-xunit-trx --results-directory "${{ runner.temp }}/test-results"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: ${{ runner.temp }}/test-results
          if-no-files-found: ignore

  # Builds every image without pushing it, so a Dockerfile that misses a project it needs fails here.
  image:
    name: Image (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gateway
            dockerfile: src/Gateway/Gateway/Dockerfile
          - name: sample-api
            dockerfile: src/Services/Sample/Sample.API/Dockerfile
          - name: feed-api
            dockerfile: src/Services/Feed/Feed.API/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          IMAGE: netboxplus/${{ matrix.name }}:ci
        run: docker build --file "$DOCKERFILE" --tag "$IMAGE" .
