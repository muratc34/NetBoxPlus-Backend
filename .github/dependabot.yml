# Weekly update pull requests against the active development branch (the default branch, master,
# still shows v1). NuGet versions live in Directory.Packages.props, so each update is one line.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: v2
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /
    target-branch: v2
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*", "Npgsql*"]
      opentelemetry:
        patterns: ["OpenTelemetry*"]
      testing:
        patterns: ["xunit*", "Testcontainers*"]
